name: iOS Quality Gate

on:
  push:
    branches: [main]
    # These root-level reports contain no executable/pinned release material.
    # Keep PR and manual validation, and never skip release manifests or source.
    paths-ignore:
      - 'README.md'
      - 'QA_*.md'
      - 'DESIGN_HOME.md'
      - 'APP_STORE_READINESS.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # macos-26 and the PHP 8.3 formula are provider-managed rolling lines. CI
  # records their exact resolved versions and binaries; fixed tools stay pinned.
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  CI_PYTHON_VERSION: '3.13.15'
  CI_PHP_VERSION: '8.3'
  CI_COMPOSER_VERSION: '2.9.8'
  CI_RUNNER_LABEL: macos-26

concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Security, iPhone and iPad
    runs-on: macos-26
    # Serial regression: observed cloud iPhone ~73m, local iPad ~45m, plus
    # setup, analysis and artifact collection. Allow headroom without retries
    # or removing tests. This execution cap does not raise the account budget.
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up audited Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          architecture: arm64
          check-latest: false

      - name: Set up PHP for WordPress contract tests
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.CI_PHP_VERSION }}
          coverage: none
          tools: composer:${{ env.CI_COMPOSER_VERSION }}

      - name: Verify and record runner provenance
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p "$RUNNER_TEMP/yishu-supply-chain"
          python3 Scripts/ci-supply-chain.py provenance \
            --output "$RUNNER_TEMP/yishu-supply-chain/runner-provenance.json"

      - name: Install hash-locked quality tools
        run: |
          python3 -m venv "$RUNNER_TEMP/yishu-quality-venv"
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement .github/requirements-quality.txt

      - name: Validate dependency and build-source policy
        run: |
          python3 Scripts/ci-supply-chain.py validate
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" \
            Server/tests/ci-supply-chain-contract-test.py

      - name: Run Python static analysis
        run: |
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" -m ruff check \
            --config Server/ruff.toml \
            Server \
            Scripts/ci-supply-chain.py \
            Scripts/ci-test-summary.py \
            Scripts/test-ci-test-summary.py \
            Scripts/check-distribution-package.py \
            Scripts/test-distribution-package.py
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" -m ruff check \
            --config Server/ruff.toml \
            --select I \
            Server/entitlement-verifier \
            Scripts/ci-supply-chain.py \
            Server/tests/ci-supply-chain-contract-test.py

      - name: Run Python SAST with Bandit
        run: |
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" -m bandit \
            --recursive \
            --severity-level medium \
            --confidence-level medium \
            --exclude Server/tests,Server/vendor \
            Server/entitlement-verifier \
            Server/operations \
            Scripts/ci-supply-chain.py \
            Scripts/ci-test-summary.py \
            Scripts/check-distribution-package.py

      - name: Generate repository SBOMs
        run: |
          python3 Scripts/ci-supply-chain.py sbom \
            --output-dir "$RUNNER_TEMP/yishu-supply-chain"

      - name: Audit Python dependency components
        run: |
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" -m pip_audit \
            --requirement Server/entitlement-verifier/requirements.txt \
            --strict \
            --disable-pip \
            --progress-spinner off \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/yishu-supply-chain/python-runtime-audit.cdx.json"
          python3 Scripts/ci-supply-chain.py verify-audit \
            --requirements Server/entitlement-verifier/requirements.txt \
            --audit "$RUNNER_TEMP/yishu-supply-chain/python-runtime-audit.cdx.json"
          "$RUNNER_TEMP/yishu-quality-venv/bin/python" -m pip_audit \
            --requirement .github/requirements-quality.txt \
            --strict \
            --disable-pip \
            --progress-spinner off \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/yishu-supply-chain/python-quality-audit.cdx.json"
          python3 Scripts/ci-supply-chain.py verify-audit \
            --requirements .github/requirements-quality.txt \
            --audit "$RUNNER_TEMP/yishu-supply-chain/python-quality-audit.cdx.json"

      - name: Audit Composer dependency components
        run: composer audit --locked --working-dir=Server

      - name: Validate repository security and optimized content
        id: preflight
        run: |
          Scripts/security-check.sh
          python3 Scripts/test-content-identifier-optimization.py

      - name: Test iPhone pages
        id: iphone
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
        run: Scripts/ci-ios-tests.sh iPhone

      - name: Test iPad pages
        id: ipad
        # Do not hide iPad failures behind a failed iPhone run. The original
        # failure still fails this job; cancellation and preflight failure stop
        # expensive native work. No retries or continue-on-error are used.
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
        run: Scripts/ci-ios-tests.sh iPad

      - name: Run Swift compiler analysis and audit Release bundle
        id: release
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
        run: Scripts/ci-release-analyze.sh

      - name: Summarize native test evidence
        if: always()
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
          CI_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          CI_IPHONE_OUTCOME: ${{ steps.iphone.outcome }}
          CI_IPAD_OUTCOME: ${{ steps.ipad.outcome }}
          CI_RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: python3 Scripts/ci-test-summary.py

      - name: Preserve runner provenance and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yishu-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yishu-supply-chain
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yishu-xcresults-${{ github.run_id }}
          path: ${{ runner.temp }}/yishu-results
          if-no-files-found: ignore
          retention-days: 7
