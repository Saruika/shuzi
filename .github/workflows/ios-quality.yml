name: iOS Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Security, iPhone and iPad
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP for WordPress contract tests
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate repository security boundary
        run: Scripts/security-check.sh

      - name: Test iPhone pages
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
        run: Scripts/ci-ios-tests.sh iPhone

      - name: Test iPad pages
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
        run: Scripts/ci-ios-tests.sh iPad

      - name: Analyze and audit Release bundle
        env:
          CI_RESULT_DIR: ${{ runner.temp }}/yishu-results
        run: Scripts/ci-release-analyze.sh

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yishu-xcresults-${{ github.run_id }}
          path: ${{ runner.temp }}/yishu-results
          if-no-files-found: ignore
          retention-days: 7
