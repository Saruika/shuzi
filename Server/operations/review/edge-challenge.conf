# Dedicated ACME bootstrap vhost, never an HTTP application backend.
server {
    listen 80;
    server_name review.shuzijun.com.cn;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/shuzijun-review-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
