# Private bootstrap listener only. This is not a public TLS virtual host.
daemon off;
pid /run/shuzijun-review-web/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /srv/shuzijun-review/tmp/nginx;
    fastcgi_temp_path /srv/shuzijun-review/tmp/fastcgi;
    limit_req_zone $binary_remote_addr zone=review_api:1m rate=5r/s;
    server {
        listen 127.0.0.1:18089 default_server;
        server_name review.shuzijun.com.cn;
        if ($host != review.shuzijun.com.cn) { return 444; }
        root /srv/shuzijun-review/site;
        client_max_body_size 22m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        location = /__review_health {
            default_type application/json;
            return 200 '{"environment":"review","exposure":"loopback-only"}';
        }
        location /wp-json/ {
            limit_req zone=review_api burst=20 nodelay;
            rewrite ^/wp-json/(.*)$ /index.php?rest_route=/$1 last;
        }
        location = /index.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/shuzijun-review/site/index.php;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass unix:/run/shuzijun-review-php/php.sock;
            fastcgi_read_timeout 50s;
        }
        location ~* ^/wp-content/uploads/[^?]*\.(jpg|jpeg|png|webp|avif|heic|mp4|m3u8|ts|m4s)$ {
            try_files $uri =404;
        }
        # No wp-admin, configuration, source files or arbitrary PHP exposure.
        location / { return 404; }
    }
}

