[global]
daemonize = no
error_log = /run/shuzijun-review-php/fpm-error.log

[review]
user = shuzijun-review
group = shuzijun-review
listen = /run/shuzijun-review-php/php.sock
listen.mode = 0600
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 15s
pm.max_requests = 300
request_terminate_timeout = 45s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /run/shuzijun-review-php/php-error.log
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 22M
php_admin_value[upload_tmp_dir] = /srv/shuzijun-review/tmp
php_admin_value[session.save_path] = /srv/shuzijun-review/tmp
php_admin_value[sendmail_path] = /usr/bin/false
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
