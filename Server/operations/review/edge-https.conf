server {
    listen 80;
    server_name review.shuzijun.com.cn;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/shuzijun-review-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://review.shuzijun.com.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name review.shuzijun.com.cn;
    ssl_certificate /etc/letsencrypt/live/review.shuzijun.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review.shuzijun.com.cn/privkey.pem;
    access_log off;
    client_max_body_size 22m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_pass http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header Host review.shuzijun.com.cn;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Yishu-Install-ID $http_x_yishu_install_id;
        # Never forward the client-supplied identity / proxy address headers.
        proxy_set_header X-Yishu-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 50s;
        proxy_read_timeout 55s;
        proxy_cache off;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
    }
}
