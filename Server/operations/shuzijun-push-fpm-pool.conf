; Values originate from the root-only systemd EnvironmentFile shared with the
; authority push worker. PHP-FPM exposes only these four reviewed variables.
env[YISHU_APNS_KEY_ID] = $YISHU_APNS_KEY_ID
env[YISHU_APNS_TEAM_ID] = $YISHU_APNS_TEAM_ID
env[YISHU_APNS_PRIVATE_KEY_PATH] = $YISHU_APNS_PRIVATE_KEY_PATH
env[YISHU_APNS_DATA_KEY_PATH] = $YISHU_APNS_DATA_KEY_PATH
