# Include this only inside the Singapore backup node's
# `server_name www.shuzijun.com.cn` block, before the generic `location /`.
#
# The CDN can retry a rejected stateful API response against its backup origin.
# The WordPress databases are batch-synchronized, so serving that retry from
# the backup database would produce invalid sessions or split registrations.
# Forward the complete namespace to the authoritative Shanghai node instead.
location ^~ /wp-json/shuzijun/v1/ {
    limit_req zone=sj_analytics burst=100 nodelay;

    # The backup apex route reaches this public www vhost through loopback and
    # has already replaced the incoming header with its real client address.
    # CDN and direct-origin requests are not trusted to supply this header, so
    # overwrite them with the immediate peer instead of forwarding spoofable
    # input to the authoritative node.
    set $yishu_client_ip $remote_addr;
    if ($remote_addr ~ ^(?:127\.0\.0\.1|::1)$) {
        set $yishu_client_ip $http_x_yishu_client_ip;
    }

    proxy_pass https://101.43.79.80;
    proxy_http_version 1.1;
    proxy_set_header Host www.shuzijun.com.cn;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Yishu-Install-ID $http_x_yishu_install_id;
    proxy_set_header X-Yishu-Client-IP $yishu_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_ssl_server_name on;
    proxy_ssl_name www.shuzijun.com.cn;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_hide_header X-Powered-By;
}
