# Include this file inside every TLS server block that can read from the
# WordPress document root. Keep it before generic PHP and static locations.
#
# A PHP file with anything appended after `.php` is not handled by the usual
# `location ~ \.php$` block. Without this explicit rule Nginx serves the source
# as a static download, regardless of whether the suffix is named `.bak`,
# `.corrupted`, `.copy`, `.cos_attempt`, or something new.
location ~* "(?:^|/)(?:wp-config\.php(?:$|[^/]+)|[^/]+\.php[^/]+$|[^/]+\.(?:bak|backup|old|orig|save|swp|tmp|copy|disabled|corrupt|corrupted|fixbak)(?:$|[._~-])|[^/]+\.before-[^/]+$|[^/]+~$)" {
    access_log off;
    log_not_found off;
    return 404;
}

# WordPress runtime directories are writable by PHP and must never execute or
# disclose a PHP payload, regardless of filename case.
location ~* ^/wp-content/(?:uploads|cache)/.*\.php(?:$|/) {
    access_log off;
    log_not_found off;
    return 404;
}

# Deny credentials, database exports, logs, package metadata, and source-control
# internals even if a future deployment accidentally places them in the webroot.
location ~* "(?:^|/)(?:\.env(?:\.[^/]*)?|\.(?:git|svn|hg)(?:/|$)|(?:composer\.(?:json|lock)|auth\.json|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml)$|[^/]+\.(?:sql(?:\.gz)?|dump|pem|key|p8|p12|pfx|jks|log|zip|tar|tar\.gz|tgz|7z|rar)$|(?:credentials|service-account)[^/]*\.json$)" {
    access_log off;
    log_not_found off;
    return 404;
}
