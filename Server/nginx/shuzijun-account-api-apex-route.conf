# Include this inside the `server_name shuzijun.com.cn` TLS server on both
# nodes, before its normal redirect. The App uses this non-CDN hostname for
# stateful account traffic so a single request cannot switch databases.
location ^~ /wp-json/shuzijun/v1/ {
    limit_req zone=sj_analytics burst=100 nodelay;

    proxy_pass https://127.0.0.1;
    proxy_http_version 1.1;
    proxy_set_header Host www.shuzijun.com.cn;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Yishu-Install-ID $http_x_yishu_install_id;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_ssl_server_name on;
    proxy_ssl_name www.shuzijun.com.cn;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_hide_header X-Powered-By;
}
