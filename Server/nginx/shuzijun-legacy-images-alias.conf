# Include after shuzijun-sensitive-files-deny.conf and before the generic
# static-file location in the www and img TLS server blocks. This replaces the
# historical document-root `images` symlink without exposing arbitrary files
# from the writable uploads tree.
location = /images {
    return 308 /images/;
}

location ~* ^/images/([A-Za-z0-9][A-Za-z0-9._-]*\.(?:jpg|jpeg|png|gif|webp|avif|ico|svg))$ {
    alias /var/www/html/shuzijun.com.cn/wp-content/uploads/hero-images/$1;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Timing-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    access_log off;
}

# Unknown extensions and nested paths are not part of the legacy image API.
location /images/ {
    access_log off;
    log_not_found off;
    return 404;
}
